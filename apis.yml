aid: literati
name: Literati
description: 'Literati is an Austin, Texas based children''s book company founded by
  Jessica Ewing that operates three connected consumer and school businesses: personalized
  monthly Book Clubs for Kids that ship five curated books matched to a child''s reading
  level and interests starting at $11.95 per month, Clubs for Classrooms for teachers,
  and a school book fair business (in-person and online) run through the OpenBook
  coordinator dashboard at openbook.literati.com and the year-round Literati Store,
  which returns a share of proceeds to participating schools. The company draws on
  150+ publishers, combines expert curation with data science to personalize book
  selection, and reports more than one million books donated to Title I schools and
  underserved communities since 2019. Literati publishes no public developer API,
  developer portal, or SDKs; its public technical surface is limited to consumer and
  school-facing web applications, iOS and Android apps, and an RFC 9116 security.txt
  vulnerability-reporting contact.'
